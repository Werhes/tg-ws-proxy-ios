name: iOS Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT: TGWSProxy.xcodeproj
  SCHEME: TGWSProxy
  BUNDLE_ID: com.werhes.tgws

jobs:
  build-release-ipa:
    name: Build Release IPA + Release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (if available)
        run: |
          if [ -d /Applications/Xcode_16.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            echo "Using default Xcode"
          fi
          xcodebuild -version

      - name: Install Rust + iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: List schemes
        run: xcodebuild -list -project "$PROJECT"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      # Build unsigned Release archive for the device so it can be distributed as .ipa.
      - name: Archive (unsigned Release)
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TGWSProxy.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      # Determine the release version/tag for this run.
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "TAG=v1.0.0-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create IPA payload
        run: |
          mkdir -p Payload
          cp -R build/TGWSProxy.xcarchive/Products/Applications/TGWSProxy.app Payload/
          zip -r "TGWSProxy-${{ steps.version.outputs.TAG }}.ipa" Payload
          ls -lh "TGWSProxy-${{ steps.version.outputs.TAG }}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGWSProxy-ios
          path: "TGWSProxy-*.ipa"

      # ---- Create GitHub Release with the .ipa (not on PRs) ----
      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "TG WS Proxy iOS ${{ steps.version.outputs.TAG }}"
          generate_release_notes: true
          files: |
            TGWSProxy-*.ipa
            TGWSProxy.xcodeproj/project.pbxproj