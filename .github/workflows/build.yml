name: iOS Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Create GitHub Release'
        type: boolean
        required: true
        default: false
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT: TGWSProxy.xcodeproj
  SCHEME: TGWSProxy
  BUNDLE_ID: com.werhes.tgws

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (if available)
        run: |
          if [ -d /Applications/Xcode_16.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            echo "Using default Xcode"
          fi
          xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project "$PROJECT"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Build for simulator
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests (if any)
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test || echo "No tests configured; skipping."

  release:
    name: Build Release IPA
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.make_release == 'true')
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (if available)
        run: |
          if [ -d /Applications/Xcode_16.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            echo "Using default Xcode"
          fi
          xcodebuild -version

      # Determine release version/tag
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: List schemes
        run: xcodebuild -list -project "$PROJECT"

      # Build unsigned archive for the device so it can be distributed as .ipa.
      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TGWSProxy.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Create IPA payload
        run: |
          mkdir -p Payload
          cp -R build/TGWSProxy.xcarchive/Products/Applications/TGWSProxy.app Payload/
          # Sign with ad-hoc identity so the .ipa can be installed on jailbroken/dev devices
          # or distributed via AltStore/Sideloadly. Remove existing codesigning if present.
          zip -r "TGWSProxy-${{ steps.version.outputs.TAG }}.ipa" Payload
          ls -lh "TGWSProxy-${{ steps.version.outputs.TAG }}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGWSProxy-ios
          path: "TGWSProxy-*.ipa"

      # ---- Signed build (if distribution certs provided via secrets) ----
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          HAS_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain

      - name: Archive (signed)
        if: env.HAS_CERT == 'true'
        env:
          HAS_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Signed.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive
          mkdir -p Payload
          cp -R build/Signed.xcarchive/Products/Applications/TGWSProxy.app Payload/
          codesign --force --deep --sign - Payload/TGWSProxy.app
          zip -r "TGWSProxy-signed-${{ steps.version.outputs.TAG }}.ipa" Payload

      - name: Upload signed IPA artifact
        if: env.HAS_CERT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TGWSProxy-ios-signed
          path: "TGWSProxy-signed-*.ipa"

      # ---- Create GitHub Release ----
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "TG WS Proxy iOS ${{ steps.version.outputs.TAG }}"
          generate_release_notes: true
          files: |
            TGWSProxy-*.ipa
            TGWSProxy.xcodeproj/project.pbxproj