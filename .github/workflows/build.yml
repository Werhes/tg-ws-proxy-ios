name: iOS Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_name:
        description: 'Release title (leave empty for default "TG WS Proxy iOS <version>")'
        required: false
        default: ''
      release_body:
        description: 'Release description (markdown)'
        required: false
        default: ''
      create_release:
        description: 'Создать GitHub Release с .ipa (чекбокс)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT: TGWSProxy.xcodeproj
  SCHEME: TGWSProxy
  BUNDLE_ID: com.werhes.tgws

jobs:
  build-release-ipa:
    name: Build Release IPA + Release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use the runner's default Xcode. Its iOS Simulator runtime matches the
      # SDK, which actool needs even for device builds (asset catalog compilation).
      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install Rust + iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: List schemes
        run: xcodebuild -list -project "$PROJECT"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      # Build the Rust core first so libtgwsproxy.a exists at TGWSProxy/libs
      # before Xcode's linker runs (works for both build and archive).
      # Run outside Xcode, so pin the device platform/arch for the device archive.
      - name: Build Rust core
        env:
          PLATFORM_NAME: iphoneos
          ARCHS: arm64
        run: |
          bash scripts/build-rust-ios.sh
          ls -lh TGWSProxy/libs/libtgwsproxy.a

      # Build unsigned Release archive for the device so it can be distributed as .ipa.
      # SKIP_RUST_BUILD=1 makes the Xcode "Build Rust Core" script phase a no-op,
      # since the Rust core is already built above.
      - name: Archive (unsigned Release)
        env:
          SKIP_RUST_BUILD: "1"
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TGWSProxy.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      # Determine the release version/tag, title and description for this run.
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "TAG=v1.0.0-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi
          TAG="$(cat $GITHUB_OUTPUT | grep '^TAG=' | cut -d= -f2-)"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_name }}" ]; then
            echo "RELEASE_NAME=${{ github.event.inputs.release_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE_NAME=TG WS Proxy iOS ${TAG}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BODY="${{ github.event.inputs.release_body }}"
            printf 'RELEASE_BODY=%s\n' "$BODY" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE_BODY=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create IPA payload
        run: |
          mkdir -p Payload
          cp -R build/TGWSProxy.xcarchive/Products/Applications/TGWSProxy.app Payload/
          zip -r "TGWSProxy-${{ steps.version.outputs.TAG }}.ipa" Payload
          ls -lh "TGWSProxy-${{ steps.version.outputs.TAG }}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGWSProxy-ios
          path: "TGWSProxy-*.ipa"

      # ---- Create GitHub Release with the .ipa (only when the checkbox is enabled
      # for manual runs; always on tag pushes; never on PRs). ----
      - name: Create Release
        if: >
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.RELEASE_NAME }}
          body: ${{ steps.version.outputs.RELEASE_BODY }}
          generate_release_notes: true
          files: |
            TGWSProxy-*.ipa
            TGWSProxy.xcodeproj/project.pbxproj